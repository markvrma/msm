[package]
name = "msm"
version = "0.1.0"
edition = "2021"
description = "Terminal player for YouTube Music + local library, with cmusfm scrobbling and pixelated album art"
license = "MIT"
authors = ["Mark Verma"]
repository = "https://github.com/markvrma/yt-music-cli"
homepage = "https://github.com/markvrma/yt-music-cli"
readme = "README.md"
keywords = ["tui", "music", "youtube-music", "mpv", "terminal"]
categories = ["command-line-utilities", "multimedia::audio"]
rust-version = "1.88"
include = ["src/**/*", "tests/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
crossterm = "0.29"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
libc = "0.2"
rookie = "0.5"
tokio = { version = "1", features = ["rt", "time"] }
ytmapi-rs = { version = "0.3", default-features = false, features = ["rustls", "simplified-queries"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
